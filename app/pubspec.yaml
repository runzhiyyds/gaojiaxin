name: love_story
description: 爱情积分 - 与 TA 一起记录、兑换
publish_to: 'none'
version: 1.6.4+1791867619
environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  go_router: ^14.2.0
  provider: ^6.1.2
  uuid: ^4.4.0
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  fl_chart: ^0.66.0
  shorebird_code_push: ^2.0.5
  package_info_plus: ^8.0.0
  http: ^1.6.0
  dio: ^5.4.0
  path_provider: ^2.1.2
  apk_sideload: ^0.0.2
  url_launcher: ^6.2.0
  app_links: ^6.4.0
  connectivity_plus: ^6.0.5
  firebase_core: ^3.8.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/APP_ICON.jpg
  adaptive_icon_background: "#FDF6F8"
  adaptive_icon_foreground: assets/icons/APP_ICON.jpg
