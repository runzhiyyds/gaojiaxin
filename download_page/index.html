<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="顺顺&佳猫的爱情故事 - 我们的爱情积分，Android 下载" />
  <title>顺顺&佳猫的爱情故事 - 下载</title>
  <style>
    :root {
      --bg-start: #FDF6F8;
      --bg-end: #F5E0E8;
      --primary: #c2185b;
      --primary-dark: #880e4f;
      --text: #37474f;
      --text-muted: #78909c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,0.85);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(136,14,79,0.08);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin: 0 0 8px;
      line-height: 1.35;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin: 0 0 28px;
    }
    .btn-download {
      display: inline-block;
      padding: 14px 32px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 14px rgba(194,24,91,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-download:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(194,24,91,0.4); }
    .btn-download:active { transform: translateY(0); }
    .version {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .ios-hint {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(0,0,0,0.06);
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .footer { margin-top: 24px; font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="card">
    <h1>顺顺&佳猫的<br>爱情故事</h1>
    <p class="subtitle">我们的爱情积分 · Android 版</p>
    <a class="btn-download" href="#" id="apkLink">下载 Android 版</a>
    <p class="version" id="versionHint">请将上方链接替换为你的 APK 下载地址</p>
    <p class="ios-hint">iOS 版敬请期待</p>
  </div>
  <p class="footer">与 TA 一起记录爱情积分</p>
  <script>
    (function(){
      var apkUrl = ''; // 替换为你的 APK 直链，例如：'https://xxx.com/app-release.apk'
      var el = document.getElementById('apkLink');
      var hint = document.getElementById('versionHint');
      if (apkUrl) {
        el.href = apkUrl;
        hint.textContent = '点击上方按钮下载安装';
      }
    })();
  </script>
</body>
</html>
